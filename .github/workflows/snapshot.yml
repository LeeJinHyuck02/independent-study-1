# SPX 옵션체인 일일 스냅샷 (PC가 꺼져 있어도 미국 장중에 수집한다).
# 결과는 같은 저장소의 data-snapshots 브랜치 snapshots/ 폴더에 쌓인다.
# 로컬로 가져오는 방법은 README "3. 옵션 데이터 수집 및 자동화" 참고.
name: option-chain-snapshot

on:
  schedule:
    # UTC 기준. 겨울(EST) 11:23·14:13 ET, 서머타임(EDT) 12:23·15:13 ET로 연중 장중이다.
    # 예약 실행은 10–60분 늦어질 수 있어 마감(16:00, 반일장 13:00) 직전을 피했다.
    - cron: "23 16 * * 1-5"
    - cron: "13 19 * * 1-5"
  workflow_dispatch:
    inputs:
      force:
        description: "Save even if quotes look stale"
        type: boolean
        default: false
      require_today:
        description: "Fail if the market traded today but no snapshot for today exists"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: option-chain-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install (data dependencies only, same versions as local)
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==2.5.4 pandas==3.1.1 pyarrow==26.0.1 yfinance==1.8.0
          python -m pip install --no-deps -e .

      - name: Check out the data-snapshots branch into store/
        run: |
          if git ls-remote --exit-code --heads origin data-snapshots; then
            git fetch --depth=1 origin data-snapshots
            git worktree add store FETCH_HEAD
          else
            git worktree add --orphan -b data-snapshots store
          fi

      - name: Collect
        env:
          # 마지막 회차(13 19)에서만 "오늘 장이 열렸는데 파일이 없으면 실패"를 켠다
          REQUIRE_TODAY: ${{ github.event.schedule == '13 19 * * 1-5' || inputs.require_today == true }}
          FORCE: ${{ inputs.force == true }}
        run: |
          args="--out-dir store/snapshots"
          if [ "$REQUIRE_TODAY" = "true" ]; then args="$args --require-today"; fi
          if [ "$FORCE" = "true" ]; then args="$args --force"; fi
          python -m mfin.data.snapshot_collector $args

      - name: Commit and push
        if: always()
        working-directory: store
        run: |
          mkdir -p snapshots
          git add snapshots
          if git diff --cached --quiet; then
            echo "no new snapshot"
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          git push origin HEAD:refs/heads/data-snapshots
